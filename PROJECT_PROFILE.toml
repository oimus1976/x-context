[baseline]
name = "oimus-ai-development-baseline"
version = "0.5"
reviewed_at = "2026-08-30"

[project]
name = "x-context"
purpose = "Read X content through the official X API for local tooling and AI-assisted analysis while preserving a narrow read-only authority boundary."
lifecycle = "experimental" # experimental | active | production

# One authority per material fact/state where practical.
[authority]
planning = "GitHub Issues and accepted specs/ADRs"
execution = "Git topic branches and pull requests"
source_code = "git"
private_actual_data = "local runtime only; never repository/PR/CI artifacts by default"
ci_result = "GitHub Actions when available; local/static evidence when Actions minutes are unavailable"
review_result = "GitHub pull-request review evidence and tracked review records"
production_state = "N/A during experimental MVP"
credentials = "local runtime configuration outside Git"
release_artifacts = "N/A until packaging/release is specified"

[risk]
persistent_facets = ["PRIVATE_DATA", "CREDENTIALS", "PLATFORM_DEPENDENT"]
# Allowed values:
# PRIVATE_DATA, EXTERNAL_WRITE, DESTRUCTIVE_IO, AI_AGENT,
# SECURITY_BOUNDARY, HIGH_AUTHORITY, PLATFORM_DEPENDENT,
# CREDENTIALS, DEPLOYMENT, CRYPTOGRAPHY, WORKFLOW_PERMISSION
# AI_AGENT means runtime agent authority/mutation, not merely AI-assisted development.
# Risk levels are named rather than numbered to reduce comprehension debt.
default_level = "HIGH_IMPACT" # ROUTINE | ELEVATED | HIGH_IMPACT

[comprehension]
required_level = "C2" # C0 Operate | C1 Diagnose | C2 Govern
owner_checkpoint = "Owner can explain and govern the official-API-only, read-only authorization boundary; same-subject personal collection binding; private activity and credential handling; bounded pagination/usage; fail-closed fallback behavior; unresolved credential lifecycle; and human-final protected effects before implementation is treated as accepted."

[governance]
ready = "human_final"
merge = "human_final"
deploy = "project_specific"
release = "project_specific"

[enforcement.main_direct_write]
desired = "forbidden_normal_path"
state = "DECLARED" # DECLARED | ENFORCED | VERIFIED | UNKNOWN
evidence = "AGENTS.md and project workflow; repository branch protection not yet verified"

[enforcement.required_ci]
desired = true
state = "UNKNOWN"
evidence = "GitHub Actions desired when available; current account Actions-minute exhaustion prevents CI evidence for this spec-only PR"

# Project-specific validation workspace authority. These values are consumed by
# tracked validation tooling; ad-hoc chat snippets are not authoritative.
[validation_workspace]
canonical_repo = "%USERPROFILE%\\x-context"
disposable_root = "%TEMP%\\x-context"
worktree_root = "%TEMP%\\x-context\\worktrees"
durable_log_dir = "%USERPROFILE%\\x-context\\logs\\verification"
final_branch = "main"

[enforcement.validation_workspace]
desired = "profile-derived paths and fail-closed final-state validation"
state = "VERIFIED"
evidence = "Issue #14 exact-head validation on Windows PowerShell 5.1: 65/65 tests PASS; invalid temp/log paths and final-state mismatches rejected; runner returned to canonical main with HEAD=origin/main and durable log present"

[verification]
real_boundary_smoke_required = true
test_matrix_required = true
exact_head_required_from_level = "HIGH_IMPACT"

[cleanup]
# Exact repo-relative paths of ignored files/directories that can be safely deleted.
# No globs, wildcards, or regex. Unknown ignored paths remain blocking by default.
disposable_ignored_paths = []
