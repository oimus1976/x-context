name: project-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  project-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout proposed revision
        # actions/checkout v7.0.1; SHA resolved from the release tag at review time.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # PR checks validate the proposed head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        # actions/setup-python v7.0.0; SHA resolved from the release tag at review time.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run project tests
        run: python -m unittest discover -s tests -v
      - name: Verify repository structure and adoption state
        run: python scripts/verify_repo.py --repository "${{ github.repository }}"
